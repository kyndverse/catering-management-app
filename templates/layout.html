{{define "layout"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.title}}</title>

    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="layout">
      {{template "sidebar" .}}
      <div class="main">
        <main class="content">{{template "content" .}}</main>
      </div>
    </div>
  </body>
</html>
{{end}}
